<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 防闪烁：与 src/App.tsx 的 applyTheme 保持同一解析算法，两处需同步修改 -->
    <script>
      (function () {
        var mode;
        try { mode = localStorage.getItem("ielts-theme"); } catch (error) { mode = null; }
        var dark = mode === "dark" || ((mode === "system" || !mode) && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.dataset.theme = "dark";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0a0d13" : "#eaeef6");
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eaeef6" />
    <meta name="description" content="听力与阅读机考练习、实时 AI 口语和学习复盘。" />
    <title>不学雅思 · 英语学习工作室</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
